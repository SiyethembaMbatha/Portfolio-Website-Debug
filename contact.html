<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio - Contact</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Contact Me</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Get In Touch</h2>

                        <form>
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required minlength="2">
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject" required>
                        <option value="">-- Please choose --</option>
                        <option value="general">General Enquiry</option>
                        <option value="project">Project Enquiry</option>
                        <option value="collaboration">Collaboration</option>
                    </select>
                </div>

                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required minlength="10"></textarea>
                </div>

                <fieldset>
                    <legend>Preferred contact method</legend>
                    <label for="contact-email">
                        <input type="radio" id="contact-email" name="contact-method" value="email" checked>
                        Email
                    </label>
                    <label for="contact-phone">
                        <input type="radio" id="contact-phone" name="contact-method" value="phone">
                        Phone
                    </label>
                </fieldset>

                <div>
                    <label for="newsletter">
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Subscribe to occasional updates
                    </label>
                </div>

                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Contact me at <a href="mailto:siyethemba.mbatha.sm@gmail.com">siyethemba.mbatha.sm@gmail.com</a></p>
    </footer>
</body>
</html>
